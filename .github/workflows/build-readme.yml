name: Rebuild README gallery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "projects/**"
      - "competitions/**"
      - "scripts/build-readme.mjs"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout with a fine-grained PAT (Contents: read/write, this repo
      # only) so the regen push authenticates as a repo admin, which the
      # main-protection ruleset already exempts from the required
      # "validate" check. Every contributor push and every PR merge stays
      # fully gated. GITHUB_TOKEN cannot be used here: the GitHub Actions
      # app cannot be added as a bypass actor on this org, and deploy keys
      # are disabled org-wide.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.README_BOT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tooling
        run: npm ci

      - name: Regenerate README sections
        run: npm run build:readme

      - name: Commit if changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: regenerate README gallery [skip ci]"
            git push
          else
            echo "README already up to date."
          fi
